name: Publish direct installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeline-direct-installer
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish installer
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and verify package
        run: |
          bash scripts/build-installzip.sh
          unzip -tq _zips/installzip.zip
          if unzip -Z1 _zips/installzip.zip | grep -Eq '(^|/)(\.env|INITIAL_GOD_PASSWORD\.txt)$|(^|/)(vendor|\.git|_zips)/|^scripts/installzip\.zip$'; then
            echo "Installer archive contains a forbidden secret, dependency, or nested package path." >&2
            exit 1
          fi
          if grep -q 'password_hash = VALUES(password_hash)' sql/seed_god.sql; then
            echo "God seed would overwrite an existing password." >&2
            exit 1
          fi
          cp _zips/installzip.zip homeline-install.zip
          sha256sum homeline-install.zip > homeline-install.zip.sha256

      - name: Publish stable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view installer-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload installer-latest \
              homeline-install.zip \
              homeline-install.zip.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create installer-latest \
              homeline-install.zip \
              homeline-install.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "HomeLine direct installer" \
              --notes "Automatically rebuilt from the latest main branch. Run the install command from the README; the bootstrap script verifies this package against the published SHA-256 checksum." \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi
